    <!-- Zero-Flash Theme Initialization -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("dashcraft:theme");
          if (!saved) {
            var legacy = localStorage.getItem("dashcraft:v1");
            if (legacy) {
              var parsed = JSON.parse(legacy);
              if (parsed && parsed.theme) saved = parsed.theme;
            }
          }
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = saved === "dark" || (saved === "system" && prefersDark) || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
          }
          document.documentElement.setAttribute("data-theme", saved || "system");
        } catch (e) {}
      })();
    </script>

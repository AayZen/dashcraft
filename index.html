    <!-- Open Graph (defaults — overridden per route by SEO component) -->
    <meta property="og:title" content="DashCraft — Visual Dashboard Builder & Analytics Dashboard Studio" />

    <!-- Twitter / X Card (defaults — overridden per route by SEO component) -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="https://dashcraft-five.vercel.app/brand/og-image.jpg" />

    <!-- Zero-Flash Theme Initialization -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("dashcraft:theme");
          if (!saved) {
            var legacy = localStorage.getItem("dashcraft:v1");
            if (legacy) {
              var parsed = JSON.parse(legacy);
              if (parsed && parsed.theme) saved = parsed.theme;
            }
          }
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = saved === "dark" || (saved === "system" && prefersDark) || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add("dark");
            document.documentElement.classList.remove("light");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
            document.documentElement.style.colorScheme = "light";
          }
          document.documentElement.setAttribute("data-theme", saved || "system");
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
